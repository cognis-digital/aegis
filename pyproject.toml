[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-aegis"
version = "0.1.1"
description = "AEGIS — AI Agent Permission & Access Auditor. Static auditor for MCP, LangChain, LlamaIndex, OpenAI Assistants, CrewAI, and AutoGen agents."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["ai-security", "mcp", "langchain", "agent-security", "owasp-llm", "prompt-injection", "cognis-digital", "cognis-neural-suite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []  # zero-dep core

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]
yaml = ["PyYAML>=6.0"]
all = ["mcp>=1.0", "fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/aegis"
Documentation = "https://suite.cognis.digital/aegis"

[project.scripts]
"aegis-emit" = "aegis.connect:emit_main"
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]
